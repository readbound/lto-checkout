[build]
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/pay"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
